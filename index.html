<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA MOUNTAIN CLIMBING</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 5;
  color: white;
  background: rgba(0,0,0,.65);
  padding: 12px;
  border-radius: 10px;
}

#staminaBar {
  width: 150px;
  height: 12px;
  background: #444;
  border-radius: 10px;
  overflow: hidden;
}

#staminaFill {
  height: 100%;
  width: 100%;
  background: limegreen;
}

#mobileControls {
  display: none;
  position: absolute;
  bottom: 25px;
  left: 20px;
  z-index: 10;
}

#joystick {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  border: 2px solid white;
  position: relative;
  touch-action: none;
}

#stick {
  width: 48px;
  height: 48px;
  background: white;
  border-radius: 50%;
  position: absolute;
  left: 36px;
  top: 36px;
}

#mobileButtons {
  position: absolute;
  right: 20px;
  bottom: 35px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

button {
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: rgba(20,20,20,.8);
  color: white;
  font-size: 15px;
}

#instructions {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: rgba(0,0,0,.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div id="hud">
  <strong>MEGA MOUNTAIN CLIMBING</strong>
  <p id="vrStatus">Checking VR support...</p>
  <p>Stamina</p>
  <div id="staminaBar">
    <div id="staminaFill"></div>
  </div>
  <p id="status">Ready to climb!</p>
</div>

<div id="mobileControls">
  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<div id="mobileButtons">
  <button id="jumpButton">JUMP</button>
  <button id="climbButton">CLIMB</button>
</div>

<div id="instructions">
  PC: WASD · Mouse to look · Space to jump<br>
  VR: Left stick moves · Right stick turns · Grip to climb
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { VRButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 180);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 500
);

const playerRig = new THREE.Group();
scene.add(playerRig);

camera.position.set(0, 1.7, 8);
playerRig.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* =========================
   LIGHTING
========================= */

scene.add(new THREE.HemisphereLight(0xffffff, 0x526044, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(30, 60, 20);
scene.add(sunlight);

/* =========================
   MOUNTAIN TERRAIN
========================= */

const groundGeometry = new THREE.PlaneGeometry(250, 250, 80, 80);
groundGeometry.rotateX(-Math.PI / 2);

const positions = groundGeometry.attributes.position;

for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const z = positions.getZ(i);

  let height =
    Math.sin(x * 0.06) * 2 +
    Math.cos(z * 0.05) * 2;

  const mountainHeight = Math.max(
    0,
    1 - Math.sqrt(
      (x*x)/1800 + ((z+35)*(z+35))/2200
    )
  );

  height += mountainHeight * 35;
  height += Math.random() * 0.7;

  positions.setY(i, height);
}

groundGeometry.computeVertexNormals();

const terrain = new THREE.Mesh(
  groundGeometry,
  new THREE.MeshStandardMaterial({
    color: 0x687b58,
    roughness: 1
  })
);

scene.add(terrain);

const peak = new THREE.Mesh(
  new THREE.ConeGeometry(13, 25, 7),
  new THREE.MeshStandardMaterial({ color: 0xeaf4f7 })
);

peak.position.set(0, 37, -35);
scene.add(peak);

/* =========================
   PICKAXE MODEL
========================= */

function createPickaxe() {
  const pickaxe = new THREE.Group();

  const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.045, 0.55, 8),
    new THREE.MeshStandardMaterial({ color: 0x79502b })
  );

  pickaxe.add(handle);

  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 0.055, 0.07),
    new THREE.MeshStandardMaterial({
      color: 0xb9c5cc,
      metalness: 0.8,
      roughness: 0.25
    })
  );

  head.position.y = 0.27;
  pickaxe.add(head);

  const point = new THREE.Mesh(
    new THREE.ConeGeometry(0.055, 0.2, 8),
    new THREE.MeshStandardMaterial({
      color: 0xb9c5cc,
      metalness: 0.8
    })
  );

  point.rotation.z = Math.PI / 2;
  point.position.set(-0.24, 0.27, 0);
  pickaxe.add(point);

  return pickaxe;
}

/* =========================
   AUTOMATIC VR DETECTION
========================= */

let vrActive = false;

const vrControllers = [];
const vrGrips = [];

const controllerHands = {
  left: null,
  right: null
};

const controllerStates = {
  left: { squeezing: false },
  right: { squeezing: false }
};

function setupVRControllers() {
  for (let i = 0; i < 2; i++) {
    const controller = renderer.xr.getController(i);
    const grip = renderer.xr.getControllerGrip(i);

    scene.add(controller);
    scene.add(grip);

    vrControllers.push(controller);
    vrGrips.push(grip);

    const pickaxe = createPickaxe();

    // The pickaxe is attached to the physical controller grip.
    pickaxe.position.set(0, -0.08, -0.13);
    pickaxe.rotation.set(Math.PI / 2, 0, 0);

    grip.add(pickaxe);

    controller.userData.pickaxe = pickaxe;

    controller.addEventListener('squeezestart', event => {
      const hand = event.data?.handedness;
      if (hand === 'left') controllerStates.left.squeezing = true;
      if (hand === 'right') controllerStates.right.squeezing = true;
    });

    controller.addEventListener('squeezeend', event => {
      const hand = event.data?.handedness;
      if (hand === 'left') controllerStates.left.squeezing = false;
      if (hand === 'right') controllerStates.right.squeezing = false;
    });
  }
}

setupVRControllers();

/* =========================
   VR SESSION DETECTION
========================= */

const vrStatus = document.getElementById('vrStatus');

renderer.xr.addEventListener('sessionstart', () => {
  vrActive = true;
  vrStatus.textContent = 'VR headset connected';
  console.log('VR session started');
});

renderer.xr.addEventListener('sessionend', () => {
  vrActive = false;

  controllerStates.left.squeezing = false;
  controllerStates.right.squeezing = false;

  vrStatus.textContent = 'VR disconnected';
  console.log('VR session ended');
});

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr')
    .then(supported => {
      vrStatus.textContent = supported
        ? 'VR headset support available'
        : 'VR not available - PC/mobile mode';
    })
    .catch(() => {
      vrStatus.textContent = 'VR support unavailable';
    });
} else {
  vrStatus.textContent = 'WebXR not supported by this browser';
}

/* =========================
   DETECT LEFT AND RIGHT HANDS
========================= */

function detectVRHands() {
  const session = renderer.xr.getSession();

  controllerHands.left = null;
  controllerHands.right = null;

  if (!session) return;

  for (const source of session.inputSources) {
    if (source.handedness === 'left') {
      controllerHands.left = source;
    }

    if (source.handedness === 'right') {
      controllerHands.right = source;
    }
  }
}

/* =========================
   VR JOYSTICK DETECTION
========================= */

let vrMoveX = 0;
let vrMoveY = 0;
let vrTurnX = 0;

function deadzone(value) {
  return Math.abs(value) < 0.15 ? 0 : value;
}

function readStick(source) {
  if (!source || !source.gamepad) return [0, 0];

  const axes = source.gamepad.axes;

  // Controller layouts differ. This supports common WebXR layouts.
  let x = axes.length >= 4 ? axes[2] : axes[0];
  let y = axes.length >= 4 ? axes[3] : axes[1];

  return [
    deadzone(x || 0),
    deadzone(y || 0)
  ];
}

function readVRJoysticks() {
  vrMoveX = 0;
  vrMoveY = 0;
  vrTurnX = 0;

  if (!vrActive) return;

  detectVRHands();

  const leftStick = readStick(controllerHands.left);
  const rightStick = readStick(controllerHands.right);

  vrMoveX = leftStick[0];
  vrMoveY = leftStick[1];
  vrTurnX = rightStick[0];
}

/* =========================
   VR PLAYER MOVEMENT
========================= */

function updateVRPlayer(delta) {
  if (!vrActive) return;

  readVRJoysticks();

  const xrCamera = renderer.xr.getCamera(camera);

  const forward = new THREE.Vector3();
  xrCamera.getWorldDirection(forward);

  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3()
    .crossVectors(forward, new THREE.Vector3(0, 1, 0))
    .normalize();

  const movement = new THREE.Vector3();

  movement.addScaledVector(forward, -vrMoveY);
  movement.addScaledVector(right, vrMoveX);

  if (movement.lengthSq() > 1) {
    movement.normalize();
  }

  // Left thumbstick movement.
  playerRig.position.addScaledVector(movement, 4 * delta);

  // Right thumbstick turning.
  playerRig.rotation.y -= vrTurnX * 2.2 * delta;
}

/* =========================
   GRIP-BASED CLIMBING
========================= */

const previousPositions = {
  left: new THREE.Vector3(),
  right: new THREE.Vector3()
};

const currentPositions = {
  left: new THREE.Vector3(),
  right: new THREE.Vector3()
};

const positionInitialized = {
  left: false,
  right: false
};

function updateGripClimbing() {
  if (!vrActive) return;

  const hands = [
    { name: 'left', controller: vrControllers[0] },
    { name: 'right', controller: vrControllers[1] }
  ];

  for (const hand of hands) {
    const name = hand.name;

    // Skip until the hand has been identified.
    if (!controllerStates[name].squeezing) {
      positionInitialized[name] = false;
      continue;
    }

    hand.controller.getWorldPosition(currentPositions[name]);

    if (positionInitialized[name]) {
      const movement = new THREE.Vector3().subVectors(
        currentPositions[name],
        previousPositions[name]
      );

      playerRig.position.sub(movement);
    }

    previousPositions[name].copy(currentPositions[name]);
    positionInitialized[name] = true;
  }
}

/* =========================
   PC CONTROLS
========================= */

const keys = {};

window.addEventListener('keydown', event => {
  keys[event.code] = true;
});

window.addEventListener('keyup', event => {
  keys[event.code] = false;
});

let mouseLocked = false;

renderer.domElement.addEventListener('click', () => {
  if (!renderer.xr.isPresenting) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  mouseLocked =
    document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', event => {
  if (!mouseLocked || renderer.xr.isPresenting) return;

  playerRig.rotation.y -= event.movementX * 0.002;

  camera.rotation.x -= event.movementY * 0.002;

  camera.rotation.x = THREE.MathUtils.clamp(
    camera.rotation.x, -1.4, 1.4
  );
});

function updatePCMovement(delta) {
  if (renderer.xr.isPresenting) return;

  const forward = new THREE.Vector3(0, 0, -1)
    .applyQuaternion(playerRig.quaternion);

  const right = new THREE.Vector3(1, 0, 0)
    .applyQuaternion(playerRig.quaternion);

  if (keys.KeyW) playerRig.position.addScaledVector(forward, 5 * delta);
  if (keys.KeyS) playerRig.position.addScaledVector(forward, -5 * delta);
  if (keys.KeyA) playerRig.position.addScaledVector(right, -5 * delta);
  if (keys.KeyD) playerRig.position.addScaledVector(right, 5 * delta);

  if (keys.Space) playerRig.position.y += 3 * delta;
}

/* =========================
   MOBILE CONTROLS
========================= */

const mobileControls = document.getElementById('mobileControls');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

if ('ontouchstart' in window) {
  mobileControls.style.display = 'block';
}

let mobileX = 0;
let mobileY = 0;
let joystickActive = false;

joystick.addEventListener('pointerdown', event => {
  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  moveJoystick(event);
});

joystick.addEventListener('pointermove', event => {
  if (joystickActive) moveJoystick(event);
});

function moveJoystick(event) {
  const rect = joystick.getBoundingClientRect();

  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  let x = event.clientX - rect.left - centerX;
  let y = event.clientY - rect.top - centerY;

  const maxDistance = 38;
  const distance = Math.sqrt(x*x + y*y);

  if (distance > maxDistance) {
    x = x / distance * maxDistance;
    y = y / distance * maxDistance;
  }

  stick.style.left = `${centerX - 24 + x}px`;
  stick.style.top = `${centerY - 24 + y}px`;

  mobileX = x / maxDistance;
  mobileY = y / maxDistance;
}

function resetJoystick() {
  joystickActive = false;
  mobileX = 0;
  mobileY = 0;
  stick.style.left = '36px';
  stick.style.top = '36px';
}

joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateMobileMovement(delta) {
  if (renderer.xr.isPresenting) return;

  const forward = new THREE.Vector3(0, 0, -1)
    .applyQuaternion(playerRig.quaternion);

  const right = new THREE.Vector3(1, 0, 0)
    .applyQuaternion(playerRig.quaternion);

  playerRig.position.addScaledVector(forward, -mobileY * 4 * delta);
  playerRig.position.addScaledVector(right, mobileX * 4 * delta);
}

/* =========================
   JUMP AND CLIMB BUTTONS
========================= */

let jumpRequested = false;
let climbRequested = false;

document.getElementById('jumpButton').addEventListener('click', () => {
  jumpRequested = true;
});

const climbButton = document.getElementById('climbButton');

climbButton.addEventListener('pointerdown', () => {
  climbRequested = true;
});

climbButton.addEventListener('pointerup', () => {
  climbRequested = false;
});

climbButton.addEventListener('pointercancel', () => {
  climbRequested = false;
});

/* =========================
   STAMINA
========================= */

let stamina = 100;

function updateStamina(delta) {
  const climbing =
    controllerStates.left.squeezing ||
    controllerStates.right.squeezing ||
    climbRequested;

  if (climbing) {
    stamina -= 10 * delta;
  } else {
    stamina += 5 * delta;
  }

  stamina = THREE.MathUtils.clamp(stamina, 0, 100);

  document.getElementById('staminaFill').style.width =
    stamina + '%';

  document.getElementById('status').textContent =
    stamina <= 0 ? 'Rest and recover!' : 'Ready to climb!';
}

/* =========================
   MAIN GAME LOOP
========================= */

const clock = new THREE.Clock();

function animate() {
  const delta = Math.min(clock.getDelta(), 0.05);

  if (renderer.xr.isPresenting) {
    updateVRPlayer(delta);
    updateGripClimbing();
  } else {
    updatePCMovement(delta);
    updateMobileMovement(delta);
  }

  if (jumpRequested) {
    playerRig.position.y += 0.12;
    jumpRequested = false;
  }

  updateStamina(delta);

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

/* =========================
   RESIZE
========================= */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
```
