<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mega Mountain Climbing</title>

<style>
body {
 margin:0;
 overflow:hidden;
 font-family:Arial;
 background:#87ceeb;
 touch-action:none;
}

#hud {
 position:absolute;
 top:12px;
 left:12px;
 padding:12px;
 background:#000b;
 color:white;
 border-radius:12px;
 z-index:5;
}

#bar {
 width:150px;
 height:10px;
 background:limegreen;
}

#mobile {
 display:none;
 position:absolute;
 bottom:25px;
 left:20px;
 z-index:6;
}

#stick {
 width:125px;
 height:125px;
 border-radius:50%;
 background:#ffffff55;
 border:2px solid white;
 position:relative;
}

#knob {
 width:45px;
 height:45px;
 background:#ffffffcc;
 border-radius:50%;
 position:absolute;
 left:40px;
 top:40px;
}

#buttons {
 position:absolute;
 bottom:30px;
 right:20px;
 display:none;
 flex-direction:column;
 gap:12px;
 z-index:6;
}

#buttons button {
 padding:17px;
 border:0;
 border-radius:50%;
 background:#263e59dd;
 color:white;
 font-weight:bold;
}

#start {
 position:absolute;
 inset:0;
 background:#000c;
 display:grid;
 place-items:center;
 color:white;
 text-align:center;
 z-index:10;
}

#start button {
 padding:18px 30px;
 border:0;
 border-radius:12px;
 background:limegreen;
 font-size:20px;
}

@media(pointer:coarse) {
 #mobile,#buttons {display:flex}
}
</style>
</head>

<body>

<div id="hud">
 <h3>🏔️ MEGA MOUNTAIN CLIMBING</h3>
 <p id="altitude">Altitude: 0m</p>
 <p>Stamina</p>
 <div id="bar"></div>
 <p id="tool">⛏️ Pickaxe equipped</p>
</div>

<div id="mobile">
 <div id="stick">
  <div id="knob"></div>
 </div>
</div>

<div id="buttons">
 <button id="jump">JUMP</button>
 <button id="grab">CLIMB</button>
 <button id="equip">PICKAXE</button>
</div>

<div id="start">
 <div>
  <h1>🏔️ MEGA MOUNTAIN CLIMBING</h1>
  <p>Grab your pickaxe and climb!</p>
  <button id="play">START CLIMBING</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,40,180);

const camera = new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,0.1,500
);

camera.position.set(0,2,25);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x59634d,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,50,30);
sun.castShadow = true;
scene.add(sun);

function mat(color) {
 return new THREE.MeshStandardMaterial({color});
}

// GROUND

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(400,400),
 mat(0x526d48)
);

ground.rotation.x = -Math.PI/2;
ground.position.y = -0.2;
scene.add(ground);

// MOUNTAINS

const rocks = [];

function mountain(x,z,height,radius) {

 const mesh = new THREE.Mesh(
  new THREE.ConeGeometry(radius,height,8,5),
  mat(0x697b80)
 );

 mesh.position.set(x,height/2,z);
 mesh.castShadow = true;
 scene.add(mesh);

 const snow = new THREE.Mesh(
  new THREE.ConeGeometry(radius*.4,height*.25,8),
  mat(0xffffff)
 );

 snow.position.set(x,height*.87,z);
 scene.add(snow);
}

mountain(0,-30,55,24);
mountain(-40,-45,43,20);
mountain(40,-55,50,23);
mountain(5,-85,75,28);

// CLIMBING ROCKS

for(let i=0;i<55;i++) {

 const rock = new THREE.Mesh(
  new THREE.DodecahedronGeometry(1+Math.random()*1.5),
  mat(0x777b78)
 );

 rock.position.set(
  (Math.random()-.5)*45,
  Math.random()*8,
  -Math.random()*65
 );

 rock.castShadow = true;
 scene.add(rock);
 rocks.push(rock);
}

// TREES

for(let i=0;i<60;i++) {

 const x = (Math.random()-.5)*100;
 const z = Math.random()*-80;

 const trunk = new THREE.Mesh(
  new THREE.CylinderGeometry(.2,.3,2),
  mat(0x60452e)
 );

 trunk.position.set(x,1,z);
 scene.add(trunk);

 const leaves = new THREE.Mesh(
  new THREE.ConeGeometry(1.5,4,7),
  mat(0x244c3c)
 );

 leaves.position.set(x,3.5,z);
 scene.add(leaves);
}

// PICKAXE MODEL

function createPickaxe() {

 const group = new THREE.Group();

 const handle = new THREE.Mesh(
  new THREE.CylinderGeometry(.055,.075,.9,10),
  mat(0x79502d)
 );

 handle.rotation.z = -.25;
 group.add(handle);

 const head = new THREE.Mesh(
  new THREE.BoxGeometry(.85,.13,.15),
  mat(0x9da8b2)
 );

 head.position.y = .38;
 group.add(head);

 const point = new THREE.Mesh(
  new THREE.ConeGeometry(.09,.35,8),
  mat(0x9da8b2)
 );

 point.rotation.z = Math.PI/2;
 point.position.x = -.48;
 point.position.y = .38;
 group.add(point);

 return group;
}

const pickaxe = createPickaxe();
pickaxe.position.set(.45,-.4,-.75);
pickaxe.rotation.set(.2,0,-.4);
camera.add(pickaxe);
scene.add(camera);

// VR CONTROLLERS

const controller1 = renderer.xr.getController(0);
const controller2 = renderer.xr.getController(1);

scene.add(controller1);
scene.add(controller2);

const vrPickaxe = createPickaxe();
vrPickaxe.position.set(.12,-.1,-.25);
vrPickaxe.scale.set(.55,.55,.55);
controller1.add(vrPickaxe);

const controller2Pickaxe = createPickaxe();
controller2Pickaxe.position.set(.12,-.1,-.25);
controller2Pickaxe.scale.set(.55,.55,.55);
controller2.add(controller2Pickaxe);

let vrGrab = false;

for(const controller of [controller1,controller2]) {
 controller.addEventListener('selectstart',()=>{
  vrGrab = true;
 });

 controller.addEventListener('selectend',()=>{
  vrGrab = false;
 });
}

// PLAYER

let stamina = 100;
let yaw = 0;
let pitch = 0;
let velocityY = 0;
let onGround = true;
let started = false;
let climbing = false;
let equipped = true;

const keys = {};

document.addEventListener('keydown',e=>{
 keys[e.code] = true;

 if(e.code === 'KeyR') {
  camera.position.set(0,2,25);
  velocityY = 0;
 }

 if(e.code === 'KeyQ') {
  equipped = !equipped;
  pickaxe.visible = equipped;
 }
});

document.addEventListener('keyup',e=>{
 keys[e.code] = false;
});

// MOUSE LOOK

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement === renderer.domElement) {
  yaw -= e.movementX*.002;
  pitch -= e.movementY*.002;
  pitch = THREE.MathUtils.clamp(pitch,-1.4,1.4);
 }
});

// MOBILE JOYSTICK

const stick = document.getElementById('stick');
const knob = document.getElementById('knob');

let joyX = 0;
let joyY = 0;
let stickActive = false;

stick.addEventListener('pointerdown',e=>{
 stickActive = true;
 stick.setPointerCapture(e.pointerId);
 updateJoystick(e);
});

stick.addEventListener('pointermove',e=>{
 if(stickActive) updateJoystick(e);
});

stick.addEventListener('pointerup',resetJoystick);
stick.addEventListener('pointercancel',resetJoystick);

function updateJoystick(e) {

 const rect = stick.getBoundingClientRect();

 let x = e.clientX-rect.left-62.5;
 let y = e.clientY-rect.top-62.5;

 const distance = Math.sqrt(x*x+y*y);
 const max = 40;

 if(distance>max) {
  x=x/distance*max;
  y=y/distance*max;
 }

 joyX=x/max;
 joyY=y/max;

 knob.style.left=(40+x)+'px';
 knob.style.top=(40+y)+'px';
}

function resetJoystick() {
 stickActive=false;
 joyX=0;
 joyY=0;
 knob.style.left='40px';
 knob.style.top='40px';
}

// MOBILE BUTTONS

let mobileJump=false;
let mobileGrab=false;

document.getElementById('jump').addEventListener(
 'pointerdown',()=>mobileJump=true
);

document.getElementById('jump').addEventListener(
 'pointerup',()=>mobileJump=false
);

document.getElementById('grab').addEventListener(
 'pointerdown',()=>mobileGrab=true
);

document.getElementById('grab').addEventListener(
 'pointerup',()=>mobileGrab=false
);

document.getElementById('grab').addEventListener(
 'pointercancel',()=>mobileGrab=false
);

document.getElementById('equip').onclick=()=>{
 equipped=!equipped;
 pickaxe.visible=equipped;
};

// MOBILE LOOK

let touchLook=null;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch' && e.clientX>innerWidth*.4) {
  touchLook={x:e.clientX,y:e.clientY,id:e.pointerId};
 }
});

renderer.domElement.addEventListener('pointermove',e=>{
 if(touchLook && touchLook.id===e.pointerId) {
  yaw-=(e.clientX-touchLook.x)*.006;
  pitch-=(e.clientY-touchLook.y)*.006;

  pitch=THREE.MathUtils.clamp(pitch,-1.4,1.4);

  touchLook.x=e.clientX;
  touchLook.y=e.clientY;
 }
});

renderer.domElement.addEventListener('pointerup',e=>{
 if(touchLook && touchLook.id===e.pointerId) touchLook=null;
});

// START

document.getElementById('play').onclick=()=>{
 started=true;
 document.getElementById('start').style.display='none';
 renderer.domElement.requestPointerLock?.();
};

// VR BUTTON

document.body.appendChild(VRButton.createButton(renderer));

// CLIMBING
