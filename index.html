#staminaFill {
    height: 100%;
    width: 100%;
    background: #54df69;
}

#instructions {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: rgba(0,0,0,.65);
    border-radius: 10px;
    padding: 10px 15px;
    text-align: center;
    font-size: 13px;
    pointer-events: none;
    white-space: nowrap;
}

#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    z-index: 4;
    pointer-events: none;
}

#mobileControls {
    display: none;
    position: fixed;

    pointer-events: none;
}

#joystick {

    border: 3px solid rgba(255,255,255,.65);
    position: relative;
    pointer-events: auto;
    touch-action: none;
}

#joystickKnob {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(230,230,230,.85);

    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

    color: white;
    border-radius: 12px;
    font-size: 14px;
    touch-action: none;
}

@media (pointer: coarse) {
    #mobileControls { display: flex; }
    #instructions { bottom: 8px; font-size: 11px; }
}

@media (pointer: fine) {
    #mobileControls { display: none; }
}
